name: Validate dictionary

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm run check
      - name: Load the glossary in Chrome on Ubuntu
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/cgcpp-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          url=http://127.0.0.1:8765/
          curl --fail --silent --retry 5 --retry-connrefused --output /dev/null "$url"
          count=$(node -p "require('./words.json').length")
          google-chrome --version
          google-chrome --headless --disable-dev-shm-usage --window-size=1366,900 \
            --virtual-time-budget=8000 --timeout=15000 --dump-dom "$url" \
            > "$RUNNER_TEMP/cgcpp-dom.html" 2> "$RUNNER_TEMP/cgcpp-chrome.log" \
            || { cat "$RUNNER_TEMP/cgcpp-chrome.log"; exit 1; }
          grep -F "公共 $count 条" "$RUNNER_TEMP/cgcpp-dom.html"
